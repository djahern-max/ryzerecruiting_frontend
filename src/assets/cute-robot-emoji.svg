<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <!-- Antenna -->
  <line x1="50" y1="8" x2="50" y2="20" stroke="#4a90d9" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="4.5" fill="#60b4ff" stroke="#4a90d9" stroke-width="1.5"/>

  <!-- Head -->
  <rect x="22" y="20" width="56" height="38" rx="10" ry="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Eyes -->
  <!-- Left eye outer -->
  <rect x="30" y="30" width="16" height="12" rx="4" fill="#3b82f6"/>
  <!-- Left eye shine -->
  <rect x="32" y="32" width="5" height="4" rx="2" fill="#93c5fd" opacity="0.9"/>
  <!-- Left eye pupil -->
  <rect x="38" y="33" width="5" height="6" rx="2" fill="#1e3a8a"/>

  <!-- Right eye outer -->
  <rect x="54" y="30" width="16" height="12" rx="4" fill="#3b82f6"/>
  <!-- Right eye shine -->
  <rect x="56" y="32" width="5" height="4" rx="2" fill="#93c5fd" opacity="0.9"/>
  <!-- Right eye pupil -->
  <rect x="62" y="33" width="5" height="6" rx="2" fill="#1e3a8a"/>

  <!-- Mouth — friendly smile bar with dots -->
  <rect x="33" y="48" width="34" height="5" rx="2.5" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="40" cy="50.5" r="2" fill="#3b82f6"/>
  <circle cx="50" cy="50.5" r="2" fill="#3b82f6"/>
  <circle cx="60" cy="50.5" r="2" fill="#3b82f6"/>

  <!-- Ear bolts -->
  <circle cx="22" cy="36" r="4.5" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="78" cy="36" r="4.5" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>

  <!-- Neck -->
  <rect x="44" y="58" width="12" height="6" rx="2" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Body -->
  <rect x="26" y="64" width="48" height="30" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Chest panel — little screen -->
  <rect x="36" y="70" width="28" height="17" rx="4" fill="#3b82f6"/>
  <!-- Screen glow lines -->
  <line x1="40" y1="75" x2="60" y2="75" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="80" x2="54" y2="80" stroke="#60b4ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms -->
  <rect x="10" y="66" width="14" height="22" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="76" y="66" width="14" height="22" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Feet -->
  <rect x="30" y="91" width="16" height="8" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <rect x="54" y="91" width="16" height="8" rx="4" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>

</svg>