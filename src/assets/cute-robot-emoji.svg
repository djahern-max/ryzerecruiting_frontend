<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Robot emoji">
  <!-- Background bubble (helps it read like an emoji) -->
  <circle cx="12" cy="12" r="10" fill="#EAF2FF" stroke="#111827" stroke-width="1.75"/>

  <!-- Antenna -->
  <path d="M12 4.2v2.2" stroke="#111827" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="12" cy="3.8" r="1.4" fill="#FF4D6D" stroke="#111827" stroke-width="1.2"/>

  <!-- Head -->
  <rect x="6.2" y="7" width="11.6" height="11" rx="3.2" fill="#D6ECFF" stroke="#111827" stroke-width="1.75"/>

  <!-- Face panel -->
  <rect x="7.7" y="9.1" width="8.6" height="6.8" rx="2.2" fill="#9FD6FF" stroke="#111827" stroke-width="1.5"/>

  <!-- Eyes (bigger, higher contrast) -->
  <circle cx="10.4" cy="12.4" r="1.1" fill="#111827"/>
  <circle cx="13.6" cy="12.4" r="1.1" fill="#111827"/>

  <!-- Smile -->
  <path d="M10.5 14.4c.9.8 2.1.8 3 0" fill="none" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Side bolts (simple) -->
  <circle cx="6.2" cy="11.2" r="1.1" fill="#FFD166" stroke="#111827" stroke-width="1.25"/>
  <circle cx="17.8" cy="11.2" r="1.1" fill="#FFD166" stroke="#111827" stroke-width="1.25"/>
</svg>